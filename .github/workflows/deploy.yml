name: Agent Server CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "chore/cicd"
  pull_request:

jobs:
  # ── Lint: PR에서만 ───────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: uv 설치
        uses: astral-sh/setup-uv@v5

      - name: 의존성 설치 (dev 포함)
        run: uv sync --frozen

  # 현재 파이썬에서는 Ruff,Test 검사 생략
  #    - name: Ruff 검사
  #      run: uv run ruff check .

  # ── Test: PR에서만 ───────────────────────────────────────────
  # test:
  #   name: Test
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'

  #   steps:
  #     - name: 코드 체크아웃
  #       uses: actions/checkout@v4

  #     - name: Python 설정
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"

  #     - name: uv 설치
  #       uses: astral-sh/setup-uv@v5

  #     - name: 의존성 설치 (dev 포함)
  #       run: uv sync --frozen

  #     - name: 테스트 실행
  #       run: uv run pytest --no-header -q

  # ── Build: arm64 이미지 빌드 + DockerHub 푸시 ────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: QEMU 설정 (arm64 크로스 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 + 푸시 (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gamyeon-agent:latest

  # ── Deploy: build 완료 후 EC2에서 pull + 재시작 ──────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: EC2 컨테이너 재시작
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: script: |
            set -e

            echo "=== [1/3] DockerHub 로그인 ==="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            echo "=== [2/3] 새 이미지 pull ==="
            cd ~/gamyeon-agent
            docker compose pull

            echo "=== [3/3] 컨테이너 재시작 ==="
            docker compose up -d

            echo "=== 배포 완료: $(date) ==="